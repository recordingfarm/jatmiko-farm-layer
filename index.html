<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff3a3a">
  <title>Jatmiko Farm Layer</title>

  <!-- v4.1: buka koneksi ke Apps Script lebih awal -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Terapkan tema tersimpan sebelum render agar tidak berkedip -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('agl_theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/style.css?v=4.8">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
</head>
<body>

  <!-- Bilah progres tipis saat memanggil server -->
  <div id="topProgress" class="top-progress" aria-hidden="true"></div>

  <!-- Layar muat awal -->
  <div id="bootOverlay" class="boot-overlay" role="status" aria-live="polite">
    <div class="logo-box big js-logo" role="img" aria-label="Logo Jatmiko Farm Layer"></div>
    <p>Memuat Jatmiko Farm Layer...</p>
  </div>

  <!-- Halaman login (diisi oleh JavaScript) -->
  <div id="loginView" hidden></div>

  <!-- Kerangka aplikasi (tampil setelah login) -->
  <div id="appShell" hidden>

    <!-- Sidebar desktop -->
    <aside class="sidebar" aria-label="Menu utama">
      <div class="sd-brand">
        <div class="logo-box js-logo" role="img" aria-label="Logo Jatmiko Farm Layer"></div>
        <div>
          <strong>Jatmiko Farm Layer</strong>
        </div>
      </div>
      <nav id="sideNav" class="sd-nav"></nav>
      <div class="sd-foot">
        <button class="sd-item" onclick="toggleTheme()" aria-label="Ganti mode terang atau gelap">
          <i class="bi bi-moon-stars"></i><span>Mode Gelap</span>
        </button>
        <button class="sd-item" onclick="logout()">
          <i class="bi bi-box-arrow-right"></i><span>Keluar</span>
        </button>
      </div>
    </aside>

    <!-- Header -->
    <header class="app-header">
      <div class="logo-box sm js-logo" role="img" aria-label="Logo Jatmiko Farm Layer"></div>
      <div class="hdr-mid">
        <div class="hdr-title"><strong>Jatmiko Farm Layer</strong></div>
        <div id="hdrStatus" class="hdr-status"></div>
      </div>
      <div class="hdr-user">
        <div class="hdr-user-txt">
          <strong id="hdrUser"></strong>
          <span id="hdrRole" class="badge b-pri"></span>
        </div>
        <button class="avatar" onclick="navigateTo('profil')" aria-label="Buka profil saya">
          <i class="bi bi-person"></i>
        </button>
      </div>
    </header>

    <!-- Konten utama: seluruh halaman disuntikkan ke sini (SPA) -->
    <main class="main" id="mainContent">
      <div id="app-container" class="page"></div>
    </main>

    <!-- Navigasi bawah (HP) -->
    <nav id="bottomNav" class="bottom-nav" aria-label="Navigasi utama"></nav>
  </div>

  <!-- Lembar modal (bottom sheet) & notifikasi -->
  <div id="sheetRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="js/config.js?v=4.8"></script>
  <script src="js/app.js?v=4.8"></script>
</body>
</html>
